# Prometheus Configuration for Nova Universe Production Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nova-universe'
    environment: 'production-test'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Nova Universe API Server
  - job_name: 'nova-api'
    static_configs:
      - targets: ['nova-api:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    params:
      format: ['prometheus']

  # Nova Unified UI
  - job_name: 'nova-unified'
    static_configs:
      - targets: ['nova-unified:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Elasticsearch
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    scrape_interval: 30s

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['nova-node-exporter:9100']
    scrape_interval: 15s

  # GoAlert
  - job_name: 'goalert'
    static_configs:
      - targets: ['nova-goalert:8081']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Uptime Kuma
  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['nova-uptime-kuma:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s
