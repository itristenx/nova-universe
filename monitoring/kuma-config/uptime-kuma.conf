# Uptime Kuma Configuration for Nova Integration
# This file configures Uptime Kuma to integrate with Nova's authentication and database

# Database Configuration
DATABASE_TYPE=postgres
DATABASE_URL=postgres://nova_admin:nova_password@postgres:5432/nova_universe?schema=uptime_kuma

# Authentication
AUTH_METHOD=nova
DISABLE_LOCAL_AUTH=true
NOVA_API_URL=http://nova-api:3000
NOVA_WEBHOOK_SECRET=nova-uptime-kuma-webhook-secret

# UI Configuration
DISABLE_WEB_UI=true
API_ONLY_MODE=true

# Performance
HEARTBEAT_INTERVAL=30
CLEANUP_RETENTION_DAYS=90

# Logging
LOG_LEVEL=warn
DISABLE_STATS=true