# Nova Universe Access Control Configuration
# This nginx configuration blocks direct access to GoAlert and Uptime-Kuma UIs
# All access must go through Nova's API and UI

server {
    listen 80;
    server_name goalert.nova.local;
    
    # Block all direct access to GoAlert UI
    location / {
        return 403 '{"error":"Direct access to GoAlert UI is disabled. Please use Nova Universe interface.","redirect":"http://localhost:3002/monitoring/alerts"}';
        add_header Content-Type application/json;
    }
    
    # Only allow Nova API to access GoAlert API
    location /api/ {
        # Only allow requests from Nova containers
        allow 172.20.0.0/16;  # Nova network subnet
        deny all;
        
        proxy_pass http://nova-goalert:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Nova-Proxy "true";
    }
}

server {
    listen 80;
    server_name uptime-kuma.nova.local;
    
    # Block all direct access to Uptime-Kuma UI
    location / {
        return 403 '{"error":"Direct access to Uptime-Kuma UI is disabled. Please use Nova Universe interface.","redirect":"http://localhost:3002/monitoring/uptime"}';
        add_header Content-Type application/json;
    }
    
    # Only allow Nova API to access Uptime-Kuma API
    location /api/ {
        # Only allow requests from Nova containers
        allow 172.20.0.0/16;  # Nova network subnet
        deny all;
        
        proxy_pass http://nova-uptime-kuma-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Nova-Proxy "true";
    }
}

# Block direct access to ports
server {
    listen 8081;
    server_name _;
    
    location / {
        return 403 '{"error":"Direct access to GoAlert is disabled. Use Nova Universe at http://localhost:3002"}';
        add_header Content-Type application/json;
    }
}

server {
    listen 3001;
    server_name _;
    
    location / {
        return 403 '{"error":"Direct access to Uptime-Kuma is disabled. Use Nova Universe at http://localhost:3002"}';
        add_header Content-Type application/json;
    }
}