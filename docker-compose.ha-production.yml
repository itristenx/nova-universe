# Nova Universe High-Availability Production Configuration
# Designed for 99.9% uptime, sub-200ms response, and 10,000 concurrent users

version: '3.8'

networks:
  nova-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_primary_data:
  postgres_replica1_data:
  postgres_replica2_data:
  redis_cluster_data_1:
  redis_cluster_data_2:
  redis_cluster_data_3:
  elasticsearch_data_1:
  elasticsearch_data_2:
  elasticsearch_data_3:
  mongodb_data:
  backups:
  ssl_certs:

services:
  # =============================================================================
  # LOAD BALANCER - NGINX
  # =============================================================================
  nginx-load-balancer:
    image: nginx:alpine
    container_name: nova-nginx-lb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ssl_certs:/etc/ssl/certs
    depends_on:
      - nova-api-1
      - nova-api-2
      - nova-api-3
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # =============================================================================
  # API SERVERS - HORIZONTAL SCALING (3 INSTANCES)
  # =============================================================================
  nova-api-1:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: nova-api-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INSTANCE_ID=api-1
      - PORT=3000
      - POSTGRES_HOST=postgres-primary
      - POSTGRES_READ_HOSTS=postgres-replica-1,postgres-replica-2
      - REDIS_CLUSTER_NODES=redis-1:6379,redis-2:6379,redis-3:6379
    volumes:
      - ./logs:/app/logs
      - backups:/app/backups
    depends_on:
      - postgres-primary
      - redis-1
      - elasticsearch-1
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'

  nova-api-2:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: nova-api-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INSTANCE_ID=api-2
      - PORT=3000
      - POSTGRES_HOST=postgres-primary
      - POSTGRES_READ_HOSTS=postgres-replica-1,postgres-replica-2
      - REDIS_CLUSTER_NODES=redis-1:6379,redis-2:6379,redis-3:6379
    volumes:
      - ./logs:/app/logs
      - backups:/app/backups
    depends_on:
      - postgres-primary
      - redis-1
      - elasticsearch-1
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'

  nova-api-3:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: nova-api-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - INSTANCE_ID=api-3
      - PORT=3000
      - POSTGRES_HOST=postgres-primary
      - POSTGRES_READ_HOSTS=postgres-replica-1,postgres-replica-2
      - REDIS_CLUSTER_NODES=redis-1:6379,redis-2:6379,redis-3:6379
    volumes:
      - ./logs:/app/logs
      - backups:/app/backups
    depends_on:
      - postgres-primary
      - redis-1
      - elasticsearch-1
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'

  # =============================================================================
  # DATABASE CLUSTER - POSTGRESQL PRIMARY + READ REPLICAS
  # =============================================================================
  postgres-primary:
    image: postgres:15-alpine
    container_name: nova-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_universe}
      POSTGRES_USER: ${POSTGRES_USER:-nova_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secure_password_123!}
      POSTGRES_REPLICATION_USER: replica_user
      POSTGRES_REPLICATION_PASSWORD: replica_password_secure_123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/postgres-primary-init:/docker-entrypoint-initdb.d
      - backups:/backups
    networks:
      - nova-production
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hot_standby=on
      -c archive_mode=on
      -c archive_command='cp %p /backups/wal/%f'
      -c max_connections=500
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_admin} -d ${POSTGRES_DB:-nova_universe}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'

  postgres-replica-1:
    image: postgres:15-alpine
    container_name: nova-postgres-replica-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_universe}
      POSTGRES_USER: ${POSTGRES_USER:-nova_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secure_password_123!}
      PGUSER: replica_user
      POSTGRES_MASTER_SERVICE: postgres-primary
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
      - ./scripts/postgres-replica-init:/docker-entrypoint-initdb.d
    depends_on:
      - postgres-primary
    networks:
      - nova-production
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replica_user -v -P -W; do
        echo 'Waiting for primary to be available...';
        sleep 5;
      done;
      echo 'standby_mode = on' >> /var/lib/postgresql/data/postgresql.conf;
      echo 'primary_conninfo = ''host=postgres-primary port=5432 user=replica_user''' >> /var/lib/postgresql/data/postgresql.conf;
      postgres;"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_admin} -d ${POSTGRES_DB:-nova_universe}"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '1.5'
        reservations:
          memory: 1.5g
          cpus: '0.75'

  postgres-replica-2:
    image: postgres:15-alpine
    container_name: nova-postgres-replica-2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_universe}
      POSTGRES_USER: ${POSTGRES_USER:-nova_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_secure_password_123!}
      PGUSER: replica_user
      POSTGRES_MASTER_SERVICE: postgres-primary
    ports:
      - "5434:5432"
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - ./scripts/postgres-replica-init:/docker-entrypoint-initdb.d
    depends_on:
      - postgres-primary
    networks:
      - nova-production
    command: >
      bash -c "
      until pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replica_user -v -P -W; do
        echo 'Waiting for primary to be available...';
        sleep 5;
      done;
      echo 'standby_mode = on' >> /var/lib/postgresql/data/postgresql.conf;
      echo 'primary_conninfo = ''host=postgres-primary port=5432 user=replica_user''' >> /var/lib/postgresql/data/postgresql.conf;
      postgres;"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_admin} -d ${POSTGRES_DB:-nova_universe}"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: '1.5'
        reservations:
          memory: 1.5g
          cpus: '0.75'

  # =============================================================================
  # REDIS CLUSTER FOR HIGH AVAILABILITY CACHING
  # =============================================================================
  redis-1:
    image: redis:7-alpine
    container_name: nova-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_cluster_data_1:/data
      - ./config/redis/redis-1.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'

  redis-2:
    image: redis:7-alpine
    container_name: nova-redis-2
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_cluster_data_2:/data
      - ./config/redis/redis-2.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'

  redis-3:
    image: redis:7-alpine
    container_name: nova-redis-3
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_cluster_data_3:/data
      - ./config/redis/redis-3.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'

  # =============================================================================
  # ELASTICSEARCH CLUSTER FOR SEARCH & ANALYTICS
  # =============================================================================
  elasticsearch-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nova-elasticsearch-1
    restart: unless-stopped
    environment:
      - node.name=elasticsearch-1
      - cluster.name=nova-cluster
      - discovery.seed_hosts=elasticsearch-2,elasticsearch-3
      - cluster.initial_master_nodes=elasticsearch-1,elasticsearch-2,elasticsearch-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_1:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - nova-production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'

  elasticsearch-2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nova-elasticsearch-2
    restart: unless-stopped
    environment:
      - node.name=elasticsearch-2
      - cluster.name=nova-cluster
      - discovery.seed_hosts=elasticsearch-1,elasticsearch-3
      - cluster.initial_master_nodes=elasticsearch-1,elasticsearch-2,elasticsearch-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_2:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
    networks:
      - nova-production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'

  elasticsearch-3:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nova-elasticsearch-3
    restart: unless-stopped
    environment:
      - node.name=elasticsearch-3
      - cluster.name=nova-cluster
      - discovery.seed_hosts=elasticsearch-1,elasticsearch-2
      - cluster.initial_master_nodes=elasticsearch-1,elasticsearch-2,elasticsearch-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_3:/usr/share/elasticsearch/data
    ports:
      - "9202:9200"
    networks:
      - nova-production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
        reservations:
          memory: 2g
          cpus: '1.0'

  # =============================================================================
  # MONGODB FOR DOCUMENT STORAGE
  # =============================================================================
  mongodb:
    image: mongo:7.0
    container_name: nova-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-nova_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-nova_secure_mongo_123!}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-nova_logs}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongodb-init:/docker-entrypoint-initdb.d
      - backups:/backups
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
        reservations:
          memory: 1g
          cpus: '0.5'

  # =============================================================================
  # MONITORING STACK
  # =============================================================================
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: nova-uptime-kuma
    restart: unless-stopped
    ports:
      - "3003:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: nova-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nova-grafana
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_secure_123!}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - nova-production
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # BACKUP SERVICE
  # =============================================================================
  backup-service:
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    container_name: nova-backup-service
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres-primary
      - POSTGRES_DB=${POSTGRES_DB:-nova_universe}
      - POSTGRES_USER=${POSTGRES_USER:-nova_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nova_secure_password_123!}
      - MONGODB_HOST=mongodb
      - MONGODB_DB=${MONGODB_DB:-nova_logs}
      - BACKUP_SCHEDULE=0 */6 * * *  # Every 6 hours
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - backups:/backups
      - ./logs:/app/logs
    depends_on:
      - postgres-primary
      - mongodb
    networks:
      - nova-production

  # =============================================================================
  # UNIFIED UI APPLICATIONS
  # =============================================================================
  nova-unified:
    build:
      context: ./apps/unified
      dockerfile: Dockerfile.prod
    container_name: nova-unified
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - API_URL=http://nginx-load-balancer
      - NEXT_PUBLIC_API_URL=https://api.nova-universe.com
    depends_on:
      - nginx-load-balancer
    networks:
      - nova-production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
        reservations:
          memory: 512m
          cpus: '0.25'