# Production Docker Compose for Nova Universe
# Optimized for production deployment with security, scaling, and monitoring

services:
  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: nova-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - nova-api
      - nova-unified
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

  # Nova API (Backend)
  nova-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    image: nova-universe/api:latest
    # container_name: nova-api  # Removed for scaling compatibility
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - POSTGRES_SSL=false
      - API_PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - CORE_DATABASE_URL=${CORE_DATABASE_URL:-${DATABASE_URL}}
      - CORE_DB_PASSWORD=${CORE_DB_PASSWORD}
      - CMDB_DATABASE_URL=${CMDB_DATABASE_URL:-${DATABASE_URL}}
      - INTEGRATION_DATABASE_URL=${INTEGRATION_DATABASE_URL:-${DATABASE_URL}}
      - NOTIFICATION_DATABASE_URL=${NOTIFICATION_DATABASE_URL:-${DATABASE_URL}}
      - USER360_DATABASE_URL=${USER360_DATABASE_URL:-${DATABASE_URL}}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL:-${DATABASE_URL}}
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD}
      - AUDIT_DATABASE_URL=${AUDIT_DATABASE_URL}
      - AUDIT_DB_PASSWORD=${AUDIT_DB_PASSWORD}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Monitoring integrations
      - ENABLE_UPTIME_KUMA=${ENABLE_UPTIME_KUMA:-true}
      - UPTIME_KUMA_API_URL=${UPTIME_KUMA_API_URL:-http://nova-uptime-kuma:3001}
      - UPTIME_KUMA_API_KEY=${UPTIME_KUMA_API_KEY:-}
      - GOALERT_PROXY_ENABLED=${GOALERT_PROXY_ENABLED:-true}
      - GOALERT_API_BASE=${GOALERT_API_BASE:-http://nova-goalert:8081}
      - GOALERT_API_KEY=${GOALERT_API_KEY:-}
      - KIOSK_TOKEN=${KIOSK_TOKEN:-demo_kiosk_token}
      - SCIM_TOKEN=${SCIM_TOKEN:-demo_scim_token}
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_USER=${SMTP_USER:-demo}
      - SMTP_PASS=${SMTP_PASS:-demo}
      - SAML_CERT=${SAML_CERT}
      - SAML_PRIVATE_KEY=${SAML_PRIVATE_KEY}
      - SMTP_PORT=${SMTP_PORT:-587}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Expose for demo connectivity from browser
    ports:
      - '3000:3000'
    volumes:
      - ./logs/api:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - mongodb
      - redis
      - elasticsearch
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Nova Core (Admin UI) - DEPRECATED - Migrated to Nova Unified UI
  # nova-core:
  #   build:
  #     context: ./apps/core
  #     dockerfile: Dockerfile.prod
  #   image: nova-universe/core:latest
  #   container_name: nova-core
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - NEXT_PUBLIC_API_URL=https://api.novauniverse.com
  #     - NEXT_PUBLIC_WS_URL=wss://api.novauniverse.com
  #   ports:
  #     - '3001:3000'
  #   networks:
  #     - nova-network
  #   healthcheck:
  #     test: ['CMD', 'curl', '-f', 'http://localhost:3000']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Nova Unified UI (Modern Admin Interface)
  nova-unified:
    build:
      context: ./apps/unified
      dockerfile: Dockerfile.prod
    image: nova-universe/unified:latest
    container_name: nova-unified
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Leave VITE_API_URL unset to use same-origin /api via nginx-demo
    ports:
      - '3001:3000'
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3

  # Static Unified UI for demo (serve existing dist)
  nova-unified-static:
    image: nginx:alpine
    container_name: nova-unified-static
    restart: unless-stopped
    profiles:
      - demo
    volumes:
      - ./apps/unified/dist:/usr/share/nginx/html:ro
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost']
      interval: 30s
      timeout: 10s
      retries: 3

  # Lightweight HTTP nginx for local demo (no TLS)
  nginx-demo:
    image: nginx:alpine
    container_name: nova-nginx-demo
    restart: unless-stopped
    profiles:
      - demo
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - nova-api
      - nova-unified-static
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3

  # Nova Orbit (End-User Portal) - DEPRECATED - Migrated to Nova Unified UI
  # nova-orbit:
  #   build:
  #     context: ./apps/orbit
  #     dockerfile: Dockerfile.prod
  #   image: nova-universe/orbit:latest
  #   container_name: nova-orbit
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - NEXT_PUBLIC_API_URL=https://api.novauniverse.com
  #   ports:
  #     - '3002:3000'
  #   networks:
  #     - nova-network
  #   healthcheck:
  #     test: ['CMD', 'curl', '-f', 'http://localhost:3000']
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: nova-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    networks:
      - nova-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c log_min_duration_statement=1000

  # MongoDB (Analytics & Logs)
  mongodb:
    image: mongo:7-jammy
    container_name: nova-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-nova_analytics}
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./backups/mongodb:/backups
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (Caching & Sessions)
  redis:
    image: redis:7-alpine
    container_name: nova-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --timeout 300
      --tcp-keepalive 60
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch (Search Engine)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nova-elasticsearch-prod
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms1g -Xmx1g'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9200/_cluster/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring & Logging
  prometheus:
    image: prom/prometheus:latest
    container_name: nova-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - nova-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  grafana:
    image: grafana/grafana:latest
    container_name: nova-grafana
    restart: unless-stopped
    ports:
      - '3004:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - nova-network

  # Uptime Kuma (Nova Sentinel Backend)
  nova-uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: nova-uptime-kuma
    restart: unless-stopped
    environment:
      - UPTIME_KUMA_IS_CONTAINER=1
    ports:
      - '3003:3001'
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3

  # GoAlert (Nova Alert)
  nova-goalert:
    image: goalert/goalert:latest
    container_name: nova-goalert
    restart: unless-stopped
    environment:
      # Connect to dedicated GoAlert Postgres
      - GOALERT_DB_URL=${GOALERT_DB_URL:-postgres://goalert:${GOALERT_DB_PASSWORD:-goalert_pass}@nova-goalert-postgres:5432/goalert?sslmode=disable}
      - GOALERT_PUBLIC_URL=${GOALERT_PUBLIC_URL:-}
      - GOALERT_DATA_ENCRYPTION_KEY=${GOALERT_DATA_ENCRYPTION_KEY:-insecure-demo-key-change}
      - TZ=${TZ:-UTC}
    ports:
      - '8081:8081'
    depends_on:
      nova-goalert-postgres:
        condition: service_healthy
    networks:
      - nova-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081']
      interval: 30s
      timeout: 10s
      retries: 5

  # GoAlert Database (Dedicated)
  nova-goalert-postgres:
    image: postgres:15-alpine
    container_name: nova-goalert-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=goalert
      - POSTGRES_USER=goalert
      - POSTGRES_PASSWORD=${GOALERT_DB_PASSWORD:-goalert_pass}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - goalert_postgres_data:/var/lib/postgresql/data
    networks:
      - nova-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goalert -d goalert']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  uptime_kuma_data:
    driver: local
  goalert_postgres_data:
    driver: local

networks:
  nova-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
