services:
  # Database
  nova-test-integration-postgres:
    image: postgres:15-alpine
    container_name: nova-test-integration-postgres
    environment:
      POSTGRES_DB: nova_test
      POSTGRES_USER: nova_test
      POSTGRES_PASSWORD: test_password_integration
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "4132:5432"
    volumes:
      - nova-test-integration-postgres-data:/var/lib/postgresql/data
    networks:
      - nova-test-integration-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_test -d nova_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  nova-test-integration-redis:
    image: redis:7-alpine
    container_name: nova-test-integration-redis
    ports:
      - "4179:6379"
    volumes:
      - nova-test-integration-redis-data:/data
    networks:
      - nova-test-integration-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # API Service
  nova-test-integration-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: nova-test-integration-api
    env_file:
      - .env.test.integration
    environment:
      NODE_ENV: test
      API_PORT: 3000
      DATABASE_URL: postgresql://nova_test:test_password_integration@nova-test-integration-postgres:5432/nova_test
      REDIS_URL: redis://nova-test-integration-redis:6379
      JWT_SECRET: test_jwt_secret_integration
      SESSION_SECRET: test_session_secret_integration
      KIOSK_TOKEN: kiosk_token_integration
      SCIM_TOKEN: scim_token_integration
      AUTH_DB_PASSWORD: test_password_integration
      # Core DB (used by databaseConfig)
      CORE_DB_HOST: nova-test-integration-postgres
      CORE_DB_PORT: 5432
      CORE_DB_NAME: nova_test
      CORE_DB_USER: nova_test
      CORE_DB_PASSWORD: test_password_integration
      # Use WASM Prisma engine to avoid native binary issues in CI
      PRISMA_CLIENT_ENGINE_TYPE: wasm
      # Fallback POSTGRES_* vars (used if CORE_* not provided)
      POSTGRES_HOST: nova-test-integration-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nova_test
      POSTGRES_USER: nova_test
      POSTGRES_PASSWORD: test_password_integration
      TEST_ENV: integration
      FORCE_LISTEN: "true"
      DISABLE_CLEANUP: "true"
    ports:
      - "4102:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      nova-test-integration-postgres:
        condition: service_healthy
      nova-test-integration-redis:
        condition: service_healthy
    networks:
      - nova-test-integration-network
    volumes:
      - ./apps/api:/app
      - ./prisma/generated:/prisma/generated:ro
      - /app/node_modules
    command: ["npm", "start"]

  # Core UI Service
  nova-test-integration-core:
    build:
      context: ./apps/core/nova-core
      dockerfile: Dockerfile.dev
    container_name: nova-test-integration-core
    environment:
      NODE_ENV: test
      PORT: 3001
      REACT_APP_API_URL: http://localhost:4102
      REACT_APP_TEST_ENV: integration
    ports:
      - "4101:3001"
    networks:
      - nova-test-integration-network
    volumes:
      - ./apps/core/nova-core:/app
      - /app/node_modules
    command: ["npm", "start"]

  # Beacon Service (placeholder HTTP server for UAT/integration)
  nova-test-integration-beacon:
    image: node:20-alpine
    container_name: nova-test-integration-beacon
    environment:
      NODE_ENV: test
      PORT: 3002
      API_URL: http://nova-test-integration-api:3000
      TEST_ENV: integration
    command: ["sh", "-c", "node -e 'require(\"http\").createServer((req,res)=>{res.end(\"Beacon placeholder\")}).listen(3002)' "]
    ports:
      - "4103:3002"
    depends_on:
      - nova-test-integration-api
    networks:
      - nova-test-integration-network

  # Communications Service
  nova-test-integration-comms:
    build:
      context: ./apps/comms/nova-comms
      dockerfile: Dockerfile.dev
    container_name: nova-test-integration-comms
    environment:
      NODE_ENV: test
      PORT: 3003
      API_URL: http://nova-test-integration-api:3000
      TEST_ENV: integration
    ports:
      - "4104:3003"
    depends_on:
      - nova-test-integration-api
    networks:
      - nova-test-integration-network
    volumes:
      - ./apps/comms/nova-comms:/app
      - /app/node_modules

  # Test Monitoring (Simplified Sentinel)
  nova-test-integration-sentinel:
    image: louislam/uptime-kuma:1-alpine
    container_name: nova-test-integration-sentinel
    ports:
      - "4181:3001"
    volumes:
      - nova-test-integration-sentinel-data:/app/data
    networks:
      - nova-test-integration-network
    environment:
      - NODE_ENV=test

volumes:
  nova-test-integration-postgres-data:
  nova-test-integration-redis-data:
  nova-test-integration-sentinel-data:

networks:
  nova-test-integration-network:
    external: true
