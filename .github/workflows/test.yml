name: Test

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: nova_test
          POSTGRES_PASSWORD: test_ci_db
        options: >-
          --health-cmd="pg_isready -U nova_test -d nova_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # App secrets
      SESSION_SECRET: test_ci_session
      JWT_SECRET: test_ci_jwt
      KIOSK_TOKEN: test_ci_kiosk
      SCIM_TOKEN: test_ci_scim
      # DB credentials
      POSTGRES_PASSWORD: test_ci_db
      AUTH_DB_PASSWORD: test_ci_db
      POSTGRES_USER: nova_test
      POSTGRES_DB: nova_test
      POSTGRES_HOST: localhost
      # App config
      CORS_ORIGINS: http://localhost:4101,http://localhost:4102
      DISABLE_AUTH: true
      API_PORT: 3000
      DEBUG_CORS: false
      DISABLE_CLEANUP: true
      # Prisma datasource for generate (point to service port 5433)
      CORE_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
      CMDB_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
      INTEGRATION_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
      NOTIFICATION_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
      USER360_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
      AUTH_DATABASE_URL: postgresql://nova_test:test_ci_db@localhost:5433/nova_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Ensure Docker is available
        run: docker --version && docker compose version || echo "Docker Compose plugin will be installed by default on ubuntu-latest"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Clean Prisma engines
        run: rm -rf node_modules/.prisma || true
      - name: Use Prisma WASM engine (CI)
        run: echo "PRISMA_CLIENT_ENGINE_TYPE=wasm" >> $GITHUB_ENV
      - name: Generate Prisma Client (all schemas)
        run: pnpm run prisma:generate:all
      - name: Run unit tests (API)
        run: pnpm -C apps/api test --runInBand --ci
      - name: Run unit tests (Unified)
        run: pnpm -C apps/unified test --ci --runInBand
      - name: Run root tests
        run: pnpm run test:ci

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --json | tee audit.json || true

  depcheck:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx depcheck || true
